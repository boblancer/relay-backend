openapi: 3.1.0
info:
  title: Browser Memory Recorder Cloud Workflow API
  version: 1.3.0
  summary: Cloud persistence and authenticated execution gateway for canonical browser workflows.
  description: |
    This contract is the handoff boundary between Browser Memory Recorder's
    local BFF and a separately implemented cloud persistence backend.

    Version 1 covers workflow persistence plus an authenticated direct and batch gateway
    to the separately operated execution service. It does not define profiles, deletion,
    migration, pagination, collaboration, durable run state, or local-file mirroring.

    The backend is authoritative for workflow identity, lifecycle fields,
    timestamps, and revisions. All writes must be atomic. Workflow values can
    contain credentials, tokens, payment data, or other sensitive information,
    so list responses and errors must never include step payloads or targets.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
tags:
  - name: Namespaces
    description: Organizational workflow containers.
  - name: Workflows
    description: Canonical workflow persistence.
  - name: Runs
    description: Authenticated workflow resolution and streaming execution gateway.
x-contract-semantics:
  canonicalSchemaVersion: "1.2"
  maximumRequestBytes: 1048576
  maximumBatchResponseBytes: 1048576
  listOrdering: updatedAt descending
  authentication: Shared HTTP Basic credentials.
  defaultNamespaceName: Default
  namespaceRules:
    - Namespaces organize workflows but are not authentication or tenant boundaries.
    - Namespace names are trimmed and use exact case-sensitive uniqueness.
    - Missing namespaces and cross-namespace workflow access use the same safe response.
  mutationRules:
    - Compare expectedRevision and apply the mutation in one atomic operation.
    - Increment revision exactly once for a successful new mutation.
    - Do not mutate stored state when validation or persistence fails.
    - Return the original result when an idempotency key is replayed with the same request.
    - Return an idempotency conflict when a key is reused for different request content.
  privacyRules:
    - Never include step payloads, targets, parameter values, or source session IDs in list responses.
    - Never include workflow content or sensitive values in error messages.
    - Never log run request bodies, parameter values, artifact IDs, or artifact URLs.

security:
  - basicAuth: []

paths:
  /v1/namespaces:
    get:
      operationId: listNamespaces
      tags:
        - Namespaces
      summary: List namespaces
      description: Returns namespace metadata ordered by name, then UUID.
      responses:
        "200":
          description: Namespace metadata ordered by name, then UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

    post:
      operationId: createNamespace
      tags:
        - Namespaces
      summary: Create a namespace
      description: |
        Creates a namespace after trimming its name. Names use exact,
        case-sensitive uniqueness. An exact idempotency replay returns the
        original `201` response.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamespaceRequest"
      responses:
        "201":
          description: Namespace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Namespace"
        "400":
          $ref: "#/components/responses/NamespaceValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/NamespaceMutationConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/namespaces/{namespaceId}:
    parameters:
      - $ref: "#/components/parameters/NamespaceId"

    get:
      operationId: getNamespace
      tags:
        - Namespaces
      summary: Get a namespace
      description: Returns namespace metadata without workflow content.
      responses:
        "200":
          description: Namespace metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Namespace"
        "400":
          $ref: "#/components/responses/NamespaceValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NamespaceNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/namespaces/{namespaceId}/workflows:
    parameters:
      - $ref: "#/components/parameters/NamespaceId"

    get:
      operationId: listWorkflows
      tags:
        - Workflows
      summary: List workflow summaries in a namespace
      description: |
        Returns workflow summaries in the namespace ordered by `updatedAt`
        descending. The list reads only privacy-safe summaries.
      responses:
        "200":
          description: Workflow summaries ordered from most recently updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScopedWorkflowNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

    post:
      operationId: createWorkflow
      tags:
        - Workflows
      summary: Create a workflow draft in a namespace
      description: |
        Creates a canonical empty workflow draft owned by the namespace.
        Namespace metadata is not added to the canonical workflow document.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Canonical workflow draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScopedWorkflowNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/namespaces/{namespaceId}/workflows/{workflowId}:
    parameters:
      - $ref: "#/components/parameters/NamespaceId"
      - $ref: "#/components/parameters/WorkflowId"

    get:
      operationId: getWorkflow
      tags:
        - Workflows
      summary: Load a canonical workflow from a namespace
      description: Returns the complete canonical workflow only when owned by the namespace.
      responses:
        "200":
          description: Complete canonical workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScopedWorkflowNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

    put:
      operationId: saveWorkflow
      tags:
        - Workflows
      summary: Save a workflow snapshot in a namespace
      description: |
        Atomically saves an edited workflow owned by the namespace when
        `expectedRevision` equals the stored revision. Exact replays return the
        original response before revision evaluation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/SaveWorkflowRequest"
      responses:
        "200":
          description: Canonical saved workflow with its new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScopedWorkflowNotFound"
        "409":
          $ref: "#/components/responses/MutationConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/namespaces/{namespaceId}/workflows/{workflowId}/finish:
    parameters:
      - $ref: "#/components/parameters/NamespaceId"
      - $ref: "#/components/parameters/WorkflowId"

    post:
      operationId: finishWorkflow
      tags:
        - Workflows
      summary: Finish a workflow in a namespace
      description: |
        Atomically saves and completes a workflow owned by the namespace when
        `expectedRevision` equals the stored revision. Exact replays return the
        original response before revision evaluation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/SaveWorkflowRequest"
      responses:
        "200":
          description: Canonical completed workflow with its new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScopedWorkflowNotFound"
        "409":
          $ref: "#/components/responses/MutationConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/workflows:
    get:
      operationId: legacyListWorkflow
      deprecated: true
      tags:
        - Workflows
      summary: List workflow summaries
      description: |
        Deprecated compatibility alias. Returns workflow summaries across all
        namespaces ordered by `updatedAt` descending.
        Version 1 is intentionally unpaginated.

        A summary contains only workflow identity and lifecycle metadata plus
        ordered step IDs, names, and positions. It must not contain full steps,
        payloads, targets, Browserbase session IDs, or parameter values.
      responses:
        "200":
          description: Workflow summaries ordered from most recently updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

    post:
      operationId: legacyCreateWorkflow
      deprecated: true
      tags:
        - Workflows
      summary: Create a workflow draft
      description: |
        Deprecated compatibility alias. Creates a canonical empty workflow
        draft in the exact-case `Default` namespace.

        The backend generates the UUID and timestamps and returns:

        - `schemaVersion: "1.2"`
        - `name: "Untitled recording"`
        - `status: "draft"`
        - `revision: 1`
        - `source.provider: "browserbase"`
        - `source.sessionId: ""`
        - an empty `steps` array

        Replaying the same idempotency key returns the original `201` response
        and must not create another workflow.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Canonical workflow draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/workflows/{workflowId}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"

    get:
      operationId: legacyGetWorkflow
      deprecated: true
      tags:
        - Workflows
      summary: Load a canonical workflow
      description: Deprecated global workflow-ID compatibility alias.
      responses:
        "200":
          description: Complete canonical workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

    put:
      operationId: legacySaveWorkflow
      deprecated: true
      tags:
        - Workflows
      summary: Save a workflow snapshot
      description: |
        Deprecated global workflow-ID compatibility alias. Atomically saves an
        edited workflow when `expectedRevision` equals the current stored revision.

        The route `workflowId` must equal `workflow.id`. The backend preserves
        the stored workflow's ID, creation time, lifecycle status, and finish
        time. It sets `updatedAt` to the server time and increments `revision`
        exactly once.

        If `expectedRevision` is stale, return `409` without changing stored
        state. Replaying the same idempotency key and identical request returns
        the original successful response rather than evaluating the stale
        revision again.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/SaveWorkflowRequest"
      responses:
        "200":
          description: Canonical saved workflow with its new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MutationConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/workflows/{workflowId}/finish:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"

    post:
      operationId: legacyFinishWorkflow
      deprecated: true
      tags:
        - Workflows
      summary: Finish a workflow
      description: |
        Deprecated global workflow-ID compatibility alias. Atomically saves the
        supplied workflow and marks it complete when `expectedRevision` equals
        the current stored revision.

        A workflow must contain at least one step. The route `workflowId` must
        equal `workflow.id`. The backend preserves `createdAt`, increments the
        revision exactly once, sets `updatedAt` to the server time, changes
        `status` to `complete`, and sets `finishedAt` to the server time only
        when it has not already been set.

        Replaying the same idempotency key and identical request returns the
        original successful response without incrementing the revision again.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/SaveWorkflowRequest"
      responses:
        "200":
          description: Canonical completed workflow with its new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MutationConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/run-by-id:
    post:
      operationId: runWorkflowById
      tags:
        - Runs
      summary: Run one stored workflow by UUID
      description: |
        Resolves the complete stored workflow and forwards it to the private automation
        service. Successful execution streams the same privacy-safe JSON Lines as the
        direct automation route. The gateway does not buffer, retain, retry, or make
        execution idempotent; disconnecting cancels the upstream run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunWorkflowByIdRequest"
      responses:
        "200":
          description: Privacy-safe progress events followed by one terminal outcome.
          headers:
            X-Run-Id:
              description: Ephemeral correlation UUID repeated in each JSON Line.
              schema:
                type: string
                format: uuid
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited run stream lines from the automation service.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/AutomationRejection"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/AutomationRejection"
        "422":
          $ref: "#/components/responses/AutomationRejection"
        "429":
          $ref: "#/components/responses/AutomationRejection"
        "500":
          $ref: "#/components/responses/AutomationRejection"
        "503":
          $ref: "#/components/responses/AutomationUnavailable"

  /v1/batches:
    post:
      operationId: createBatch
      tags:
        - Runs
      summary: Queue a process-local workflow batch
      description: |
        Forwards one to ten complete workflow documents to the private automation
        service without interpreting their persistence schema. The private service
        remains authoritative for executable-workflow validation. The gateway never
        retries creation because an uncertain retry could execute browser actions twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "202":
          description: The batch was accepted into private process memory.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAccepted"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/AutomationRejection"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/AutomationRejection"
        "429":
          $ref: "#/components/responses/AutomationRejection"
        "500":
          $ref: "#/components/responses/AutomationRejection"
        "503":
          $ref: "#/components/responses/AutomationUnavailable"

  /v1/batches/{batchId}:
    get:
      operationId: getBatch
      tags:
        - Runs
      summary: Poll a process-local workflow batch
      description: |
        Proxies the private service's privacy-safe snapshot. Batch state and thumbnail
        capabilities are process-local and disappear when that single service process
        restarts.
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Safe progress and optional sensitive thumbnail metadata.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSnapshot"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AutomationRejection"
        "406":
          $ref: "#/components/responses/AutomationRejection"
        "500":
          $ref: "#/components/responses/AutomationRejection"
        "503":
          $ref: "#/components/responses/AutomationUnavailable"

  /v1/artifacts/{artifactId}:
    get:
      operationId: getRunArtifact
      tags:
        - Runs
      summary: Read a temporary terminal screenshot
      description: |
        Proxies an opaque, temporary artifact capability from the private automation
        service. Artifact IDs and URLs are sensitive and must not be logged.
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Compressed terminal viewport thumbnail.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AutomationRejection"
        "406":
          $ref: "#/components/responses/AutomationRejection"
        "500":
          $ref: "#/components/responses/AutomationRejection"
        "503":
          $ref: "#/components/responses/AutomationUnavailable"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Shared credentials configured by the backend operator.

  parameters:
    NamespaceId:
      name: namespaceId
      in: path
      required: true
      description: Server-generated namespace UUID.
      schema:
        type: string
        format: uuid

    WorkflowId:
      name: workflowId
      in: path
      required: true
      description: Server-generated workflow UUID.
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID identifying one logical mutation.

        Keys are global across workflow mutation endpoints. Reusing a key with
        the same method, path, and canonical request content returns the
        original status and body. Reusing it for different content returns
        `409 idempotency_conflict`. Flat and namespace-scoped route paths are
        distinct identities even when they address the same workflow.
      schema:
        type: string
        format: uuid

  requestBodies:
    SaveWorkflowRequest:
      required: true
      description: |
        Complete canonical workflow plus the revision last loaded by the
        caller. The total request body must not exceed 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SaveWorkflowRequest"

  responses:
    Unauthorized:
      description: Shared HTTP Basic credentials are missing or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: HTTP Basic authentication challenge.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: Authentication is required.

    ValidationFailed:
      description: The path, request body, or workflow is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: The workflow request is invalid.

    NamespaceValidationFailed:
      description: The namespace path or request body is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: The namespace request is invalid.

    NamespaceNotFound:
      description: The namespace does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              value:
                error:
                  code: not_found
                  message: The namespace was not found.

    ScopedWorkflowNotFound:
      description: The namespace or an owned workflow does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              value:
                error:
                  code: not_found
                  message: The namespace or workflow was not found.

    NotFound:
      description: The workflow does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              value:
                error:
                  code: not_found
                  message: The workflow was not found.

    MutationConflict:
      description: |
        The expected revision is stale or the idempotency key was previously
        used for different request content.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            revision:
              value:
                error:
                  code: revision_conflict
                  message: The workflow changed since it was loaded.
            idempotency:
              value:
                error:
                  code: idempotency_conflict
                  message: The idempotency key was already used for another request.

    IdempotencyConflict:
      description: The idempotency key was previously used for another request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            idempotency:
              value:
                error:
                  code: idempotency_conflict
                  message: The idempotency key was already used for another request.

    NamespaceMutationConflict:
      description: The name exists or the idempotency key belongs to another request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            name:
              value:
                error:
                  code: namespace_conflict
                  message: A namespace with that name already exists.
            idempotency:
              value:
                error:
                  code: idempotency_conflict
                  message: The idempotency key was already used for another request.

    RequestTooLarge:
      description: The request body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            tooLarge:
              value:
                error:
                  code: validation_failed
                  message: The workflow request must be 1 MiB or smaller.

    Unavailable:
      description: Workflow persistence is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unavailable:
              value:
                error:
                  code: unavailable
                  message: Workflow storage is temporarily unavailable.

    Internal:
      description: An unexpected persistence failure occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                error:
                  code: internal
                  message: The workflow storage operation failed.

    AutomationRejection:
      description: The private automation service rejected or failed the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationErrorResponse"

    AutomationUnavailable:
      description: The automation service is unavailable or shutting down.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationErrorResponse"
          examples:
            unavailable:
              value:
                error:
                  code: automation_unavailable
                  message: The automation service is unavailable.

  schemas:
    ErrorCode:
      type: string
      enum:
        - unauthorized
        - validation_failed
        - not_found
        - revision_conflict
        - idempotency_conflict
        - namespace_conflict
        - unavailable
        - internal
        - automation_unavailable

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              minLength: 1
              description: Safe message that contains no workflow or storage details.

    AutomationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1

    RunWorkflowByIdRequest:
      type: object
      additionalProperties: false
      required:
        - workflowId
      properties:
        workflowId:
          type: string
          format: uuid
        startStepId:
          type: string
          minLength: 1
        parameterValues:
          type: object
          additionalProperties:
            type: string

    BatchRequest:
      type: object
      additionalProperties: false
      required:
        - runs
      properties:
        runs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/BatchRunRequest"

    BatchRunRequest:
      type: object
      additionalProperties: false
      required:
        - workflow
      properties:
        workflow:
          type: object
          additionalProperties: true
          description: Opaque executable workflow forwarded unchanged to the private service.

    BatchAccepted:
      type: object
      additionalProperties: false
      required:
        - batchId
        - runCount
      properties:
        batchId:
          type: string
          format: uuid
        runCount:
          type: integer
          minimum: 1
          maximum: 10

    BatchSnapshot:
      type: object
      additionalProperties: false
      required:
        - batchId
        - runs
      properties:
        batchId:
          type: string
          format: uuid
        runs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/BatchRunSnapshot"

    BatchRunSnapshot:
      type: object
      additionalProperties: false
      required:
        - workflowId
        - status
      properties:
        workflowId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
        currentStep:
          type: integer
          minimum: 0
        totalSteps:
          type: integer
          minimum: 0
        passedSteps:
          type: integer
          minimum: 0
        skippedSteps:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          minimum: 0
        failedStepId:
          type: string
        failedStepIndex:
          type: integer
          minimum: 0
        phase:
          type: string
          enum:
            - acting
            - asserting
            - settling
            - waiting
        code:
          type: string
        thumbnail:
          $ref: "#/components/schemas/TerminalThumbnail"

    TerminalThumbnail:
      type: object
      additionalProperties: false
      required:
        - url
        - mediaType
        - width
        - height
        - expiresAt
      properties:
        url:
          type: string
          pattern: ^/v1/artifacts/[0-9a-fA-F-]{36}$
        mediaType:
          type: string
          const: image/webp
        width:
          type: integer
          minimum: 1
          maximum: 480
        height:
          type: integer
          minimum: 1
          maximum: 300
        expiresAt:
          type: string
          format: date-time

    CreateNamespaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Namespace name, trimmed before validation and storage.

    Namespace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NamespaceListResponse:
      type: object
      additionalProperties: false
      required:
        - namespaces
      properties:
        namespaces:
          type: array
          description: Namespace metadata ordered by name, then UUID.
          items:
            $ref: "#/components/schemas/Namespace"

    WorkflowListResponse:
      type: object
      additionalProperties: false
      required:
        - workflows
      properties:
        workflows:
          type: array
          description: Summaries ordered by `updatedAt` descending.
          items:
            $ref: "#/components/schemas/WorkflowSummary"

    WorkflowSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - status
        - updatedAt
        - steps
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: Canonical trimmed workflow name.
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        updatedAt:
          type: string
          format: date-time
        steps:
          type: array
          description: Step summaries ordered by `order` ascending.
          items:
            $ref: "#/components/schemas/WorkflowStepSummary"

    WorkflowStepSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - order
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0

    SaveWorkflowRequest:
      type: object
      additionalProperties: false
      required:
        - workflow
        - expectedRevision
      properties:
        workflow:
          $ref: "#/components/schemas/Workflow"
        expectedRevision:
          type: integer
          minimum: 1
          description: Revision last loaded by the caller.

    Workflow:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - id
        - name
        - status
        - revision
        - createdAt
        - updatedAt
        - source
        - steps
      properties:
        schemaVersion:
          type: string
          const: "1.2"
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: Trimmed by the canonical boundary and non-empty afterward.
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/WorkflowSource"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"

    WorkflowStatus:
      type: string
      enum:
        - draft
        - complete

    WorkflowSource:
      type: object
      additionalProperties: false
      required:
        - provider
        - sessionId
      properties:
        provider:
          type: string
          const: browserbase
        sessionId:
          type: string
          description: May be empty when no recording session has started.
        startUrl:
          type: string

    WorkflowStep:
      oneOf:
        - $ref: "#/components/schemas/NavigateStep"
        - $ref: "#/components/schemas/ClickStep"
        - $ref: "#/components/schemas/FillStep"
        - $ref: "#/components/schemas/SetDateStep"
        - $ref: "#/components/schemas/SelectStep"
        - $ref: "#/components/schemas/CheckStep"
        - $ref: "#/components/schemas/UncheckStep"
        - $ref: "#/components/schemas/KeypressStep"
        - $ref: "#/components/schemas/SubmitStep"
      discriminator:
        propertyName: type
        mapping:
          navigate: "#/components/schemas/NavigateStep"
          click: "#/components/schemas/ClickStep"
          fill: "#/components/schemas/FillStep"
          set_date: "#/components/schemas/SetDateStep"
          select: "#/components/schemas/SelectStep"
          check: "#/components/schemas/CheckStep"
          uncheck: "#/components/schemas/UncheckStep"
          keypress: "#/components/schemas/KeypressStep"
          submit: "#/components/schemas/SubmitStep"

    StepBase:
      type: object
      required:
        - id
        - order
        - name
        - enabled
        - page
        - metadata
      properties:
        id:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
          description: Trimmed by the canonical boundary and non-empty afterward.
        enabled:
          type: boolean
        page:
          $ref: "#/components/schemas/PageDescriptor"
        target:
          $ref: "#/components/schemas/ElementTarget"
        position:
          $ref: "#/components/schemas/ViewportPosition"
        waitAfter:
          $ref: "#/components/schemas/ReplayWait"
        metadata:
          $ref: "#/components/schemas/StepMetadata"

    ElementStepBase:
      allOf:
        - $ref: "#/components/schemas/StepBase"
        - type: object
          required:
            - target
          properties:
            target:
              $ref: "#/components/schemas/ReplayableElementTarget"

    NavigateStep:
      allOf:
        - $ref: "#/components/schemas/StepBase"
        - type: object
          required:
            - type
            - payload
          properties:
            type:
              type: string
              const: navigate
            payload:
              type: object
              additionalProperties: false
              required:
                - url
              properties:
                url:
                  type: string
                  minLength: 1
      unevaluatedProperties: false

    ClickStep:
      allOf:
        - $ref: "#/components/schemas/ElementStepBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              const: click
            payload:
              $ref: "#/components/schemas/EmptyPayload"
      unevaluatedProperties: false

    FillStep:
      allOf:
        - $ref: "#/components/schemas/ElementStepBase"
        - type: object
          required:
            - type
            - payload
            - parameterBinding
          properties:
            type:
              type: string
              const: fill
            payload:
              type: object
              additionalProperties: false
              required:
                - value
              properties:
                value:
                  type: string
            parameterBinding:
              $ref: "#/components/schemas/ParameterBinding"
      unevaluatedProperties: false

    SetDateStep:
      allOf:
        - $ref: "#/components/schemas/ElementStepBase"
        - type: object
          required:
            - type
            - payload
          properties:
            type:
              type: string
              const: set_date
            payload:
              type: object
              additionalProperties: false
              required:
                - value
              properties:
                value:
                  type: string
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                  description: Calendar date formatted as YYYY-MM-DD.
      unevaluatedProperties: false

    SelectStep:
      allOf:
        - $ref: "#/components/schemas/ElementStepBase"
        - type: object
          required:
            - type
            - payload
          properties:
            type:
              type: string
              const: select
            payload:
              type: object
              additionalProperties: false
              required:
                - value
              properties:
                value:
                  type: string
                label:
                  type: string
      unevaluatedProperties: false

    CheckStep:
      allOf:
        - $ref: "#/components/schemas/ElementStepBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              const: check
            payload:
              $ref: "#/components/schemas/EmptyPayload"
      unevaluatedProperties: false

    UncheckStep:
      allOf:
        - $ref: "#/components/schemas/ElementStepBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              const: uncheck
            payload:
              $ref: "#/components/schemas/EmptyPayload"
      unevaluatedProperties: false

    KeypressStep:
      allOf:
        - $ref: "#/components/schemas/ElementStepBase"
        - type: object
          required:
            - type
            - payload
          properties:
            type:
              type: string
              const: keypress
            payload:
              type: object
              additionalProperties: false
              required:
                - key
                - modifiers
              properties:
                key:
                  type: string
                  minLength: 1
                modifiers:
                  type: array
                  items:
                    type: string
                    enum:
                      - Alt
                      - Control
                      - Meta
                      - Shift
      unevaluatedProperties: false

    SubmitStep:
      allOf:
        - $ref: "#/components/schemas/ElementStepBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              const: submit
            payload:
              $ref: "#/components/schemas/EmptyPayload"
      unevaluatedProperties: false

    EmptyPayload:
      type: object
      additionalProperties: false
      maxProperties: 0

    ParameterBinding:
      oneOf:
        - $ref: "#/components/schemas/RecordedParameterBinding"
        - $ref: "#/components/schemas/FixedParameterBinding"
        - $ref: "#/components/schemas/ProfileParameterBinding"
        - $ref: "#/components/schemas/RuntimeParameterBinding"
      discriminator:
        propertyName: source
        mapping:
          recorded: "#/components/schemas/RecordedParameterBinding"
          fixed: "#/components/schemas/FixedParameterBinding"
          profile: "#/components/schemas/ProfileParameterBinding"
          runtime: "#/components/schemas/RuntimeParameterBinding"

    RecordedParameterBinding:
      type: object
      additionalProperties: false
      required:
        - source
      properties:
        source:
          type: string
          const: recorded

    FixedParameterBinding:
      type: object
      additionalProperties: false
      required:
        - source
        - value
      properties:
        source:
          type: string
          const: fixed
        value:
          type: string
          maxLength: 10000

    ProfileParameterBinding:
      type: object
      additionalProperties: false
      required:
        - source
        - field
      properties:
        source:
          type: string
          const: profile
        field:
          type: string
          enum:
            - identity.fullName
            - identity.email
            - location.countryRegion
            - location.postalCode

    RuntimeParameterBinding:
      type: object
      additionalProperties: false
      required:
        - source
      properties:
        source:
          type: string
          const: runtime

    PageDescriptor:
      type: object
      additionalProperties: false
      required:
        - id
        - url
      properties:
        id:
          type: string
          minLength: 1
        url:
          type: string
        title:
          type: string

    StepMetadata:
      type: object
      additionalProperties: false
      required:
        - recordedAt
        - origin
        - sensitive
      properties:
        recordedAt:
          type: string
          format: date-time
        origin:
          type: string
          enum:
            - recorded
            - manual
        sensitive:
          type: boolean

    ViewportPosition:
      type: object
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: number
        y:
          type: number
        frameUrl:
          type: string

    ReplayWait:
      type: object
      additionalProperties: false
      properties:
        delayMs:
          type: integer
          minimum: 0
          maximum: 30000
        condition:
          $ref: "#/components/schemas/ReplayWaitCondition"
      anyOf:
        - required:
            - condition
        - required:
            - delayMs
          properties:
            delayMs:
              type: integer
              minimum: 1
              maximum: 30000

    ReplayWaitCondition:
      type: object
      additionalProperties: false
      required:
        - state
        - target
      properties:
        state:
          type: string
          enum:
            - visible
            - hidden
        target:
          $ref: "#/components/schemas/ReplayableElementTarget"

    ElementTarget:
      type: object
      additionalProperties: false
      properties:
        selector:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        tagName:
          type: string
        inputType:
          type: string
        frameUrl:
          type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/LocatorCandidate"

    ReplayableElementTarget:
      allOf:
        - $ref: "#/components/schemas/ElementTarget"
        - anyOf:
            - required:
                - selector
            - required:
                - role
            - required:
                - name
            - required:
                - text
            - required:
                - candidates
              properties:
                candidates:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/LocatorCandidate"

    LocatorCandidate:
      type: object
      additionalProperties: false
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - testId
            - role
            - accessibleName
            - label
            - text
            - css
            - xpath
        value:
          type: string
          minLength: 1
        name:
          type: string
        exact:
          type: boolean
          default: true
        unique:
          type: boolean
