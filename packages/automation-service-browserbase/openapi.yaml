openapi: 3.1.0
info:
  title: Relay Browserbase Automation Service
  version: 1.2.0
  summary: Immediate and in-memory background execution of finalized Relay workflows.
  description: |
    Unauthenticated local-development API for running complete schema 1.3 workflows in
    fresh Browserbase sessions. Direct runs are streamed, while background batches are
    kept only in process memory. Bind to loopback and do not expose this POC publicly.
    Runs must not be retried automatically because browser actions can have side effects.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-contract-semantics:
  maximumRequestBytes: 1048576
  directRunResponseMediaType: application/x-ndjson
  batchResponseMediaType: application/json
  batchMaximumRuns: 10
  batchMaximumRetained: 100
  batchTerminalTtlSeconds: 3600
  durable: false
  privacyRules:
    - Never emit workflow documents, URLs, payloads, parameter values, credentials, provider session identifiers, connection URLs, or raw exceptions.
    - Do not enable request-body or request-header logging.
paths:
  /v1/run:
    post:
      operationId: runWorkflow
      summary: Run one finalized workflow
      description: |
        Validates the request before creating a paid Browserbase session. A valid run
        returns a stream of privacy-safe JSON Lines. The final line always has type
        `worker.outcome`. Disconnecting cancels the run; the result cannot be resumed
        or retrieved later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Privacy-safe progress events followed by one terminal outcome.
          headers:
            X-Run-Id:
              description: Ephemeral correlation UUID repeated in each JSON Line.
              schema:
                type: string
                format: uuid
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited RunStreamLine objects.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidRun"
        "429":
          $ref: "#/components/responses/AtCapacity"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/ShuttingDown"
  /v1/batches:
    post:
      operationId: createBatch
      summary: Queue a process-local workflow batch
      description: |
        Accepts one to ten complete workflow documents and queues each workflow once in
        FIFO order. The batch and its polling result are lost when the process exits.
        Callers must not automatically retry an uncertain submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "202":
          description: The batch was accepted into process memory.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchAccepted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/AtBatchCapacity"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/ShuttingDown"
  /v1/batches/{batchId}:
    get:
      operationId: getBatch
      summary: Poll a process-local workflow batch
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Privacy-safe progress for the retained batch.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSnapshot"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/BatchNotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/Internal"
  /health/live:
    get:
      operationId: getLiveness
      summary: Report process liveness
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether the service accepts new runs
      responses:
        "200":
          $ref: "#/components/responses/Healthy"
        "503":
          description: The process is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    RunRequest:
      type: object
      additionalProperties: false
      required: [workflow]
      properties:
        workflow:
          type: object
          description: Complete canonical Relay schema 1.3 workflow document. Earlier versions are rejected before provider provisioning.
        startStepId:
          type: string
          minLength: 1
        parameterValues:
          type: object
          additionalProperties:
            type: string
    BatchRequest:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/BatchRunRequest"
    BatchRunRequest:
      type: object
      additionalProperties: false
      required: [workflow]
      properties:
        workflow:
          type: object
          required: [schemaVersion, id, status]
          properties:
            schemaVersion:
              type: string
              const: "1.3"
            id:
              type: string
              format: uuid
            status:
              type: string
              const: complete
          description: Complete canonical schema 1.3 workflow validated again before provisioning.
    BatchAccepted:
      type: object
      additionalProperties: false
      required: [batchId, runCount]
      properties:
        batchId:
          type: string
          format: uuid
        runCount:
          type: integer
          minimum: 1
          maximum: 10
    BatchSnapshot:
      type: object
      additionalProperties: false
      required: [batchId, runs]
      properties:
        batchId:
          type: string
          format: uuid
        runs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/BatchRunSnapshot"
    BatchRunSnapshot:
      type: object
      additionalProperties: false
      required: [workflowId, status]
      properties:
        workflowId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed]
        currentStep:
          type: integer
          minimum: 0
        totalSteps:
          type: integer
          minimum: 0
        passedSteps:
          type: integer
          minimum: 0
        skippedSteps:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          minimum: 0
        failedStepId:
          type: string
        failedStepIndex:
          type: integer
          minimum: 0
        phase:
          type: string
          enum: [acting, asserting, settling, waiting]
        code:
          type: string
    RunStreamLine:
      type: object
      required: [runId, type]
      properties:
        runId:
          type: string
          format: uuid
        type:
          type: string
      additionalProperties: true
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, shutting_down]
  responses:
    InvalidRequest:
      description: The JSON request shape is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotAcceptable:
      description: The caller does not accept the operation's response media type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RequestTooLarge:
      description: The request exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The request is not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRun:
      description: The workflow or parameter selection cannot be run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AtCapacity:
      description: The process is already running its configured maximum.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AtBatchCapacity:
      description: The process already retains 100 non-expired batches.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BatchNotFound:
      description: The batch is unknown, expired, or was lost with an earlier process.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The service could not start the run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ShuttingDown:
      description: The service is no longer accepting runs during shutdown.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Healthy:
      description: The process is healthy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
